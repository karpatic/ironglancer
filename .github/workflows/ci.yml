name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run browser interaction tests
        run: node --test tests/dense-diagram-browser.test.js
        env:
          IRONGLANCER_BROWSER_TESTS: '1'

      - name: Build demo site
        run: npm run build:demo

      - name: Check Action bundle freshness
        run: npm run check:action-bundle

      - name: Run release integrity checks
        run: npm run release:check

      - name: Package dry run
        run: npm pack --dry-run

      - name: Dogfood local Action
        uses: ./
        with:
          folder: examples/bundless-react
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.sha }}
          entry: main.jsx
          module-limit: 500
          report-path: architecture-diff.json
          sarif-path: architecture-diff.sarif
